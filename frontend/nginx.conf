# ============================================================
#   OPTICUS FRONTEND — nginx para a SPA gerada pelo Vite
# ============================================================

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Não anuncia a versão do nginx nas respostas de erro nem nos headers.
    server_tokens off;

    # Cabeçalhos de segurança, aplicados a toda resposta.
    #
    # Atenção ao editar: um `add_header` dentro de um bloco `location`
    # faz aquele bloco deixar de herdar TODOS os `add_header` daqui. Por
    # isso o controle de cache abaixo usa `expires`, e não `add_header`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Arquivos gerados pelo Vite levam hash no nome: o conteúdo nunca muda
    # sob o mesmo nome, então podem ficar em cache por um ano. Asset
    # inexistente responde 404, em vez de devolver o index.html com 200.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: qualquer rota do React Router é servida pelo index.html — o
    # equivalente ao rewrite do vercel.json. O index.html não é cacheado,
    # para que um deploy novo chegue ao navegador sem precisar limpar cache.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
